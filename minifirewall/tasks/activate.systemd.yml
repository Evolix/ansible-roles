---

- name: Enable minifirewall.service
  ansible.builtin.systemd:
    name: minifirewall.service
    # It's weird to have to compare explicitely with True, but when the value is None/null it doesn't work well
    enabled: "{{ minifirewall_current_autostart == True or minifirewall_autostart == True }}"

# Legacy alert5

- name: check if /etc/init.d/alert5 exists
  ansible.builtin.stat:
    path: /etc/init.d/alert5
  register: initd_alert5

- name: Remove minifirewall from /etc/init.d/alert5
  ansible.builtin.lineinfile:
    dest: /etc/init.d/alert5
    regexp: "{{ item }}"
    state: absent
  loop:
    - '## starts the firewall'
    - 'minifirewall'
  when: initd_alert5.stat.exists

- name: check if /usr/share/scripts/alert5 exists
  ansible.builtin.stat:
    path: /usr/share/scripts/alert5.sh
  register: usr_share_scripts_alert5

- name: Remove minifirewall from /usr/share/scripts/alert5
  ansible.builtin.lineinfile:
    dest: /usr/share/scripts/alert5.sh
    regexp: "{{ item }}"
    state: absent
  loop:
    - '## starts the firewall'
    - 'minifirewall'
  when: usr_share_scripts_alert5.stat.exists

