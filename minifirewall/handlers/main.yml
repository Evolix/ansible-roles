---

- name: restart nagios-nrpe-server
  ansible.builtin.service:
    name: nagios-nrpe-server
    state: restarted

- name: restart minifirewall (modern/sysvinit)
  ansible.builtin.command:
    cmd: /etc/init.d/minifirewall restart
  register: minifirewall_init_restart
  failed_when: "'minifirewall failed' in minifirewall_init_restart.stdout"

- name: restart minifirewall (modern/systemd)
  ansible.builtin.systemd:
    name: minifirewall.service
    state: restarted

- name: restart minifirewall (legacy)
  ansible.builtin.command:
    cmd: /etc/init.d/minifirewall restart
  register: minifirewall_init_restart
  failed_when: "'starting IPTables rules is now finish : OK' not in minifirewall_init_restart.stdout"

- name: restart minifirewall (noop)
  ansible.builtin.meta: noop
  register: minifirewall_init_restart
  failed_when: False
  changed_when: False

- name: enable minifirewall.service
  ansible.builtin.systemd:
    name: minifirewall.service
    enabled: True
    daemon-reload: yes
