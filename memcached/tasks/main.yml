- name: Ensure memcached is installed
  ansible.builtin.apt:
    name: memcached
    state: present
  tags:
    - memcached

- ansible.builtin.import_tasks: instance-default.yml
  when: memcached_instance_name | length == 0

- ansible.builtin.import_tasks: instance-multi.yml
  when: memcached_instance_name | length > 0

- ansible.builtin.import_tasks: munin.yml

- ansible.builtin.import_tasks: nrpe.yml
