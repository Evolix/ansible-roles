---

- ansible.builtin.include_role:
    name: evolix/remount-usr
  when: elasticsearch_additional_scripts_dir is search("/usr")

- name: "{{ elasticsearch_additional_scripts_dir }} exists"
  ansible.builtin.file:
    dest: "{{ elasticsearch_additional_scripts_dir }}"
    mode: "0700"
    owner: root
    group: root
    state: directory

- name: Plugins upgrade script is installed
  ansible.builtin.copy:
    src: upgrade_elasticsearch_plugins.sh
    dest: "{{ elasticsearch_additional_scripts_dir }}/upgrade_elasticsearch_plugins.sh"
    mode: "0755"
    owner: "root"
    group: "root"
    force: true

- name: Versions check script is installed
  ansible.builtin.copy:
    src: check_elasticsearch_versions.sh
    dest: "{{ elasticsearch_additional_scripts_dir }}/check_elasticsearch_versions.sh"
    mode: "0755"
    owner: "root"
    group: "root"
    force: true

- name: Versions check script is scheduled
  ansible.builtin.cron:
    name: check_elasticsearch_versions
    job: "{{ elasticsearch_additional_scripts_dir }}/check_elasticsearch_versions.sh"
    user: root
    special_time: "{{ elasticsearch_check_versions_special_time }}"
    state: "{{ elasticsearch_check_versions_enabled | bool | ternary('present', 'absent') }}"
