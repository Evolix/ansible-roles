---

- name: "Set php version to 8.4 (Debian 13)"
  ansible.builtin.set_fact:
    php_version: "8.4"
  when: not (php_sury_enable | bool)
  check_mode: no

- name: "Set php config directories (Debian 13)"
  ansible.builtin.set_fact:
    php_cli_conf_dir: "/etc/php/{{ php_version }}/cli/conf.d"
    php_apache_conf_dir: "/etc/php/{{ php_version }}/apache2/conf.d"
    php_fpm_conf_dir: "/etc/php/{{ php_version }}/fpm/conf.d"
    php_fpm_pool_dir: "/etc/php/{{ php_version }}/fpm/pool.d"

- name: "Set php config files (Debian 12)"
  ansible.builtin.set_fact:
    php_cli_defaults_ini_file: "{{ php_cli_conf_dir }}/z-evolinux-defaults.ini"
    php_cli_custom_ini_file: "{{ php_cli_conf_dir }}/zzz-evolinux-custom.ini"
    php_apache_defaults_ini_file: "{{ php_apache_conf_dir }}/z-evolinux-defaults.ini"
    php_apache_custom_ini_file: "{{ php_apache_conf_dir }}/zzz-evolinux-custom.ini"
    php_fpm_defaults_ini_file: "{{ php_fpm_conf_dir }}/z-evolinux-defaults.ini"
    php_fpm_custom_ini_file: "{{ php_fpm_conf_dir }}/zzz-evolinux-custom.ini"
    php_fpm_debian_default_pool_file: "{{ php_fpm_pool_dir }}/www.conf"
    php_fpm_default_pool_file: "{{ php_fpm_pool_dir }}/www-evolinux-defaults.conf"
    php_fpm_default_pool_custom_file: "{{ php_fpm_pool_dir }}/www-evolinux-zcustom.conf"
    php_fpm_default_pool_socket: "/var/run/php/php{{ php_version }}-fpm.sock"
    php_fpm_service_name: "php{{ php_version }}-fpm"

# Packages

- name: "Set package list (Debian 13)"
  ansible.builtin.set_fact:
    php_stretch_packages:
      - php-cli
      - php-gd
      - php-intl
      # - php-imap ## Currently not in Trixie
      - php-ldap
      - libldap-common
      - php-mysql
      - php-pgsql
      - php-sqlite3
      - php-curl
      - php-ssh2
      - php-xml
      - php-zip
      - composer
      - libphp-phpmailer

- ansible.builtin.import_tasks: sury_pre.yml
  when: php_sury_enable

- name: "Install PHP packages (Debian 13)"
  ansible.builtin.apt:
    name: '{{ php_stretch_packages }}'
    update_cache: yes
    state: present

- name: "Install mod_php packages (Debian 13)"
  ansible.builtin.apt:
    name:
      - libapache2-mod-php
      - php
    state: present
  when: php_apache_enable

- name: "Install PHP FPM packages (Debian 13)"
  ansible.builtin.apt:
    name:
      - php-fpm
      - php
    state: present
  when: php_fpm_enable

# Configuration

- name: "Enforce permissions on PHP directory (Debian 13)"
  ansible.builtin.file:
    dest: "{{ item }}"
    mode: "0755"
  loop:
    - /etc/php
    - /etc/php/{{ php_version }}

- ansible.builtin.import_tasks: config_cli.yml

- name: "Enforce permissions on PHP cli directory (Debian 13)"
  ansible.builtin.file:
    dest: /etc/php/{{ php_version }}/cli
    mode: "0755"

- ansible.builtin.import_tasks: config_fpm.yml
  when: php_fpm_enable

- name: "Enforce permissions on PHP fpm directory (Debian 13)"
  ansible.builtin.file:
    dest: /etc/php/{{ php_version }}/fpm
    mode: "0755"
  when: php_fpm_enable

- ansible.builtin.import_tasks: config_apache.yml
  when: php_apache_enable

- name: "Enforce permissions on PHP apache2 directory (Debian 13)"
  ansible.builtin.file:
    dest: /etc/php/{{ php_version }}/apache2
    mode: "0755"
  when: php_apache_enable

- ansible.builtin.import_tasks: sury_post.yml
  when: php_sury_enable
