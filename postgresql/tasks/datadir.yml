---

- block:
  - name: "Is {{ postgresql_custom_datadir }} present?"
    ansible.builtin.stat:
      path: "{{ postgresql_custom_datadir }}"
    check_mode: no
    register: "postgresql_custom_datadir_test"

  - name: "Read the real datadir"
    ansible.builtin.command:
      cmd: "readlink -f /var/lib/postgresql"
    changed_when: False
    check_mode: no
    register: "postgresql_current_real_datadir_test"
  tags:
    - "postgresql"
  when: "postgresql_custom_datadir | length > 0"

- block:
  - name: "PostgreSQL is stopped"
    ansible.builtin.service:
      name: "postgresql"
      state: "stopped"

  - name: "Move PostgreSQL datadir to {{ postgresql_custom_datadir }}"
    ansible.builtin.command:
      cmd: "mv {{ postgresql_current_real_datadir_test.stdout }} {{ postgresql_custom_datadir }}"
    args:
      creates: "{{ postgresql_custom_datadir }}"

  - name: "Symlink {{ postgresql_custom_datadir }} to /var/lib/postgresql"
    ansible.builtin.file:
      src: "{{ postgresql_custom_datadir }}"
      dest: "/var/lib/postgresql"
      state: "link"

  - name: "PostgreSQL is started"
    ansible.builtin.service:
      name: "postgresql"
      state: "started"
  tags:
    - "postgresql"
  when:
    - "postgresql_custom_datadir | length > 0"
    - "postgresql_custom_datadir != postgresql_current_real_datadir_test.stdout"
    - "not postgresql_custom_datadir_test.stat.exists"
