---
# Should LXC containers run in unprivilegied (non root) mode?
lxc_unprivilegied_containers: false

# Network type to use. See lxc.container.conf(5).
lxc_network_type: "none"

# Partition to bind mount into containers.
lxc_mount_part: "/home"

# It's "template_options" used directly by community.general.lxc_container
lxc_template_options: ""
lxc_template_final_options: ""

# List of LXC containers to create.
# Eg.:
# lxc_containers:
#   - name: php56
#     release: jessie
#   - name: php70
#     release: stretch
#   - name: php81
#     release: bullseye
lxc_containers: []
