---
- name: "Check if container {{ name }} exists"
  ansible.builtin.command:
    cmd: "lxc-ls {{ name }}"
  changed_when: False
  check_mode: no
  register: container_exists

- name: "Enable Bullseye backports from Evolix"
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/pub_evolix.asc] https://pub.evolix.org/evolix bullseye-backports main"
    filename: evolix-backports
    state: present
  when:
    - release == 'jessie' or release == 'stretch' or release == 'buster'
    - ansible_distribution_major_version is version('11', '==')

- name: "Install lxc-templates from Bullseye backports"
  ansible.builtin.apt:
    name: lxc-templates
    default_release: bullseye-backports
    state: latest
    update_cache: yes
  when:
    - release == 'jessie' or release == 'stretch' or release == 'buster'
    - ansible_distribution_major_version is version('11', '==')

- name: "Install keyring for eLTS"
  ansible.builtin.apt:
    name:
      - freexian-archive-keyring
  when: release == 'jessie' or release == 'stretch' or release == 'buster'

- name: "Create container {{ name }}"
  community.general.lxc_container:
    name: "{{ name }}"
    container_log: true
    template: debian
    state: stopped
    template_options: "--arch amd64 --release {{ release }} {{ lxc_template_final_options__internal }}"
  when: container_exists.stdout_lines | length == 0
  vars:
    lxc_template_final_options_jessie: >-
      --keyring=/etc/apt/trusted.gpg.d/freexian-archive-extended-lts.gpg
      --mirror=https://elts.evolix.org/extended-lts
      --security-mirror=http://archive.debian.org/debian-security
      {{ lxc_template_options }}
    lxc_template_final_options_stretch: >-
      --keyring=/usr/share/keyrings/debian-archive-removed-keys.gpg
      --mirror=http://archive.debian.org/debian
      --security-mirror=http://archive.debian.org/debian-security
      {{ lxc_template_options }}
    lxc_template_final_options_buster: >-
      --mirror=http://archive.debian.org/debian
      --security-mirror=http://archive.debian.org/debian-security
      {{ lxc_template_options }}
    lxc_template_final_options__internal: >-
      {%- if release == 'jessie' and ansible_distribution_major_version is version('11', '>=') -%}
        {{ lxc_template_final_options_jessie }}
      {%- elif release == 'stretch' and ansible_distribution_major_version is version('11', '>=') -%}
        {{ lxc_template_final_options_stretch }}
      {%- elif release == 'buster' and ansible_distribution_major_version is version('11', '>=') -%}
        {{ lxc_template_final_options_buster }}
      {%- else -%}
        {{ lxc_template_final_options }}
      {%- endif -%}

- name: "Disable network configuration inside container {{ name }}"
  ansible.builtin.replace:
    name: "/var/lib/lxc/{{ name }}/rootfs/etc/default/networking"
    regexp: "^#CONFIGURE_INTERFACES=yes"
    replace: CONFIGURE_INTERFACES=no
  when: lxc_network_type == "none"

- name: "Disable interface shut down on halt inside container {{ name }} (Jessie container)"
  ansible.builtin.lineinfile:
    name: "/var/lib/lxc/{{ name }}/rootfs/etc/default/halt"
    line: "NETDOWN=no"
  when: lxc_network_type == "none" and release == "jessie"

- name: "Make the container {{ name }} poweroff on SIGPWR sent by lxc-stop (Jessie container)"
  ansible.builtin.file:
    src: /lib/systemd/system/poweroff.target
    dest: "/var/lib/lxc/{{ name }}/rootfs/etc/systemd/system/sigpwr.target"
    state: link
  when: release == 'jessie'

- name: "Configure the DNS resolvers in the container {{ name }}"
  ansible.builtin.copy:
    remote_src: yes
    src: /etc/resolv.conf
    dest: "/var/lib/lxc/{{ name }}/rootfs/etc/"

- name: "Add hostname in /etc/hosts for container {{ name }}"
  ansible.builtin.lineinfile:
    name: "/var/lib/lxc/{{ name }}/rootfs/etc/hosts"
    line: "127.0.0.1 {{ name }}"

- name: "Fix permission on /dev for container {{ name }}"
  ansible.builtin.lineinfile:
    name: "/var/lib/lxc/{{ name }}/rootfs/etc/rc.local"
    line: "chmod 755 /dev"
    insertbefore: "^exit 0$"
  when: release == 'jessie'

- name: "Ensure that {{ name }} container is running"
  community.general.lxc_container:
    name: "{{ name }}"
    state: started

- name: "Ensure /etc/profile.d exists in container {{ name }}"
  ansible.builtin.file:
    path: "/var/lib/lxc/{{ name }}/rootfs/etc/profile.d"
    mode: '0755'
    state: directory

- name: "Copy host /etc/profile.d/evolinux into container {{ name }}"
  ansible.builtin.copy:
    src: "/etc/profile.d/evolinux.sh"
    remote_src: true
    dest: "/var/lib/lxc/{{ name }}/rootfs/etc/profile.d/evolinux.sh"
    mode: '0644'

- name: "Purge OpenSSH in container {{ name }}"
  ansible.builtin.shell:
    cmd: "DEBIAN_FRONTEND=noninteractive lxc-attach --name {{ name }} --  apt-get purge -y openssh-server"

- name: "Fix bullseye repository in container {{ name }}"
  ansible.builtin.replace:
    dest: "/var/lib/lxc/{{ name }}/rootfs/etc/apt/sources.list"
    regexp: 'bullseye/updates'
    replace: 'bullseye-security'
  when: release == 'bullseye'

- name: "Is sources.list present in container?"
  ansible.builtin.stat:
    path: "/var/lib/lxc/{{ name }}/rootfs/etc/apt/sources.list"
  check_mode: no
  register: lxc_is_apt_sources_list

- name: "Fix bookworm repository in container {{ name }}"
  ansible.builtin.replace:
    dest: "/var/lib/lxc/{{ name }}/rootfs/etc/apt/sources.list"
    regexp: 'bookworm/updates'
    replace: 'bookworm-security'
  when:
    - release == 'bookworm'
    - lxc_is_apt_sources_list.stat.exists

- name: "{{ name }} - Update APT cache"
  ansible.builtin.shell:
    cmd: "DEBIAN_FRONTEND=noninteractive lxc-attach --name {{ name }} --  apt-get update"

- name: "{{ name }} - Upgrade APT packages"
  ansible.builtin.shell:
    cmd: "DEBIAN_FRONTEND=noninteractive lxc-attach --name {{ name }} --  apt-get upgrade -y"

- name: "Init /etc git repository in container {{ name }}"
  ansible.builtin.include_role:
    name: 'etc-git'
    tasks_from: 'repository.yml'
    apply:
      vars:
        gitignore_items:
          - "aliases.db"
          - "*.swp"
          - "postfix/sa-blacklist.access"
          - "postfix/*.db"
          - "postfix/spamd.cidr"
          - "evobackup/.keep-*"
          - "letsencrypt/.certbot.lock"
      become: yes
  loop: ["/var/lib/lxc/{{ name }}/rootfs/etc/"]
  loop_control:
    loop_var: 'repository_path'
