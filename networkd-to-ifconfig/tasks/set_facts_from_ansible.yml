---

- name: Prepare variables (IPv4)
  ansible.builtin.set_fact:
    eni_ipv4_address: "{{ ansible_default_ipv4.address | ansible.utils.ipv4 }}"
    eni_ipv4_gateway: "{{ ansible_default_ipv4.gateway | ansible.utils.ipv4 }}"
  when: ansible_default_ipv4 | length > 0

- name: Prepare variables (IPv6)
  ansible.builtin.set_fact:
    eni_ipv6_address: "{{ ansible_default_ipv6.address | ansible.utils.ipv6 | first }}"
    eni_ipv6_gateway: "{{ ansible_default_ipv6.gateway | ansible.utils.ipv6 | first }}"
  when: ansible_default_ipv6 | length > 0
