---

- name: Verify that at least 1 NTP server is provided
  ansible.builtin.assert:
    that: timesyncd_ntp_servers | length > 0
    msg: The variable timesyncd_ntp_servers must contain at least 1 element

- name: Install systemd-timesyncd related packages
  ansible.builtin.apt:
    name:
      - systemd-timesyncd
      - dbus-broker
    state: present
  tags:
    - timesyncd

- name: Remove other NTP packages
  ansible.builtin.apt:
    name:
      - openntpd
      - ntp
    state: absent
  tags:
    - timesyncd

- name: Ensure /etc/systemd/timesyncd.conf.d directory exists
  ansible.builtin.file:
    path: /etc/systemd/timesyncd.conf.d
    state: directory
    mode: "755"
    owner: root
    group: root
  tags:
    - timesyncd

- name: Copy timesyncd config
  ansible.builtin.template:
    src: timesyncd.conf.j2
    dest: /etc/systemd/timesyncd.conf.d/evolix.conf
    mode: "0644"
  notify: Restart timesyncd
  tags:
    - timesyncd

- name: Ensure /etc/systemd/system/dbus.socket.d directory exists
  ansible.builtin.file:
    path: /etc/systemd/system/dbus.socket.d
    state: directory
    mode: "755"
    owner: root
    group: root
  tags:
    - timesyncd

- name: Copy dbus.socket.conf override
  ansible.builtin.template:
    src: dbus.socket-override.conf.j2
    dest: /etc/systemd/system/dbus.socket.d/override.conf
    mode: "0644"
  notify: Restart timesyncd
  tags:
    - timesyncd
