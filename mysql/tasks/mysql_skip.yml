---

- name: "Copy script mysql_skip.sh into /usr/local/bin/"
  ansible.builtin.copy:
    src: mysql_skip.sh
    dest: "/usr/local/bin/mysql_skip.sh"
    owner: root
    group: root
    mode: "0700"
    force: true
  tags:
    - mysql_skip

- name: "Copy config file for mysql_skip.sh"
  ansible.builtin.template:
    src: mysql_skip.conf.j2
    dest: "/etc/mysql_skip.conf"
    owner: root
    group: root
    mode: "0600"
  tags:
    - mysql_skip

- name: "Create log file for mysql_skip.sh"
  ansible.builtin.file:
    path: "/var/log/mysql/mysql-skip.log"
    state: touch
    owner: root
    group: adm
    mode: "0640"
    modification_time: "preserve"
    access_time: "preserve"
  tags:
    - mysql_skip

- name: "Test if /etc/logrotate.d/mariadb contains /var/log/mysql/*.log"
  ansible.builtin.lineinfile:
    dest: /etc/logrotate.d/mariadb
    search_string: "/var/log/mysql/*.log"
    state: absent
  check_mode: yes
  changed_when: false
  register: logrotate_mariadb

- name: "Copy logrotate file for mysql_skip.sh"
  ansible.builtin.template:
    src: mysql_skip.logrotate.j2
    dest: "/etc/logrotate.d/mysql_skip"
    owner: root
    group: root
    mode: "0600"
  # We don't want /etc/logrotate.d/mysql_skip to be in conflict with /etc/logrotate.d/mariadb
  when: not logrotate_mariadb.found
  tags:
    - mysql_skip

- name: "Copy mysql_skip.sh systemd unit"
  ansible.builtin.template:
    src: mysql_skip.systemd.j2
    dest: /etc/systemd/system/mysql_skip.service
    force: true

- name: "Start or stop systemd unit"
  ansible.builtin.systemd:
    name: mysql_skip
    daemon_reload: yes
    state: "{{ mysql_skip_enabled | bool | ternary('started', 'stopped') }}"
