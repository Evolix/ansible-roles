---

- name: Check if supervisord is installed
  ansible.builtin.shell:
    cmd: dpkg -l supervisor 2> /dev/null | grep -q -E '^(i|h)i'
  register: dpkg
  changed_when: false
  failed_when: false
  check_mode: false

- name: /etc/supervisord/conf.d and sub-files are world-readable
  when: dpkg.rc == 0
  ansible.builtin.file:
    dest: /etc/supervisor/conf.d/
    state: directory
    recurse: true
    mode: "a+r"
