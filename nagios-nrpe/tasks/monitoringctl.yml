---

### Install dependencies

- name: "Install dependencies"
  ansible.builtin.apt:
    name: [ bash-completion, nagios-nrpe-plugin, gawk ]
    state: present

- name: "Remount /usr RW after apt hook put it RO"
  ansible.builtin.include_role:
    name: remount-usr

### Prepare files copy

- name: "Library directory is present"
  ansible.builtin.file:
    path: "{{ monitoringctl_lib_dir }}"
    state: directory
    mode: "0755"

- name: "Directory /var/lib/monitoringctl/ exists"
  ansible.builtin.file:
    path: "{{ monitoringctl_var_dir }}"
    state: directory
    mode: "0755"

- name: Stat /etc/bash_completion
  ansible.builtin.stat:
    path: /etc/bash_completion
  register: _etc_bash_completion

- name: "Directory /etc/bash_completion.d exists"
  ansible.builtin.file:
    path: /etc/bash_completion.d
    state: directory
    mode: "0755"
  when: _etc_bash_completion.stat.exists


### Push files

- name: "Copy monitoringctl_common.py lib (for alerts_wrapper.py)"
  ansible.builtin.copy:
    src: "monitoringctl/upstream/monitoringctl_common.py"
    dest: "{{ monitoringctl_lib_dir }}/common.py"
    mode: "0644"
    force: true

- name: "Copy alerts_wrapper"
  ansible.builtin.copy:
    src: "monitoringctl/upstream/alerts_wrapper.py"
    dest: "{{ monitoringctl_wrapper_path }}"
    group: staff
    mode: "0755"
    force: true

- name: "Copy monitoringctl"
  ansible.builtin.copy:
    src: "monitoringctl/upstream/monitoringctl"
    dest: "{{ monitoringctl_bin_dir }}/monitoringctl"
    mode: "0755"
    force: true

- name: "Copy monitoringctl_completion script"
  ansible.builtin.copy:
    src: "monitoringctl/upstream/monitoringctl_completion"
    dest: /etc/bash_completion.d/monitoringctl
    mode: "0644"
    force: true
  when: _etc_bash_completion.stat.exists

- name: "Copy check-local (it's just a wrapper calling 'monitoringctl check' for backward compatibility)"
  ansible.builtin.copy:
    src: "monitoringctl/upstream/check-local"
    dest: "{{ monitoringctl_bin_dir }}/check-local"
    owner: root
    group: root
    mode: "0755"
    force: true

- name: "Copy completion for check-local"
  ansible.builtin.copy:
    src: "monitoringctl/upstream/check-local_completion"
    dest: /etc/bash_completion.d/check-local
    mode: "0755"
  when: _etc_bash_completion.stat.exists


### Configuration

- name: "nagios user can run monitoringctl enable with sudo (used by alerts_wrapper)"
  ansible.builtin.lineinfile:
    path: /etc/sudoers.d/monitoringctl
    regexp: "nagios.*monitoringctl enable"
    line: "nagios           ALL = NOPASSWD:{{ monitoringctl_bin_dir }}/monitoringctl enable *"
    create: true
    mode: "0640"
    validate: "visudo -c -f %s"

- name: "Remove nagios sudoer for old alerts_switch"
  ansible.builtin.lineinfile:
    path: /etc/sudoers.d/monitoringctl
    regexp: "nagios.*alerts_switch"
    state: "absent"
    validate: "visudo -c -f %s"

