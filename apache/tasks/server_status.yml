---

- name: "server_status | Server status dirname exists"
  ansible.builtin.file:
    dest: "{{ apache_serverstatus_suffix_file | dirname }}"
    mode: "0700"
    owner: root
    group: root
    state: directory
  tags:
    - apache

- name: "server_status | Set apache serverstatus suffix if provided"
  ansible.builtin.copy:
    dest: "{{ apache_serverstatus_suffix_file }}"
    # The last character "\u000A" is a line feed (LF), it's better to keep it
    content: "{{ apache_serverstatus_suffix }}\u000A"
    force: true
  when: apache_serverstatus_suffix | length > 0
  tags:
    - apache

- name: "server_status | Generate random string for server-status suffix"
  ansible.builtin.shell:
    cmd: "apg -a 1 -M N -n 1 > {{ apache_serverstatus_suffix_file }}"
  args:
    creates: "{{ apache_serverstatus_suffix_file }}"
  tags:
    - apache

- name: "server_status | Read apache server status suffix"
  ansible.builtin.command:
    cmd: "tail -n 1 {{ apache_serverstatus_suffix_file }}"
  changed_when: False
  check_mode: no
  register: new_apache_serverstatus_suffix
  tags:
    - apache

- name: "server_status | Overwrite apache_serverstatus_suffix"
  ansible.builtin.set_fact:
    apache_serverstatus_suffix: "{{ new_apache_serverstatus_suffix.stdout }}"
  tags:
    - apache

- name: "server_status | Print apache_serverstatus_suffix"
  ansible.builtin.debug:
    var: apache_serverstatus_suffix
    verbosity: 1
  tags:
    - apache

- name: "server_status | Replace server-status suffix in default site index"
  ansible.builtin.replace:
    dest: "/var/www/index.html"
    regexp: '__SERVERSTATUS_SUFFIX__'
    replace: "{{ apache_serverstatus_suffix }}"
  tags:
    - apache

- name: "server_status | Add server-status suffix in default site index if missing"
  ansible.builtin.replace:
    dest: "/var/www/index.html"
    regexp: '"/server-status-?"'
    replace: '"/server-status-{{ apache_serverstatus_suffix }}"'
  tags:
    - apache

- name: "server_status | Add server-status suffix in default VHost"
  ansible.builtin.replace:
    dest: "{{ apache_config_dir }}/sites-available/000-evolinux-default.conf"
    regexp: '<Location /server-status-?>'
    replace: '<Location /server-status-{{ apache_serverstatus_suffix }}>'
  notify: "reload apache"
  tags:
    - apache

- name: "server_status | Add server-status suffix in nagios conf"
  ansible.builtin.replace:
    dest: "/etc/nagios/nrpe.d/evolix.cfg"
    regexp: '/server-status-NNNNN '
    replace: '/server-status-{{ apache_serverstatus_suffix }} '
  when: not ansible_check_mode
  tags:
    - apache

- name: "server_status | Munin configuration has a section for apache"
  ansible.builtin.lineinfile:
    dest: "/etc/munin/plugin-conf.d/munin-node"
    line: "[apache_*]"
    create: no
  tags:
    - apache

- name: "server_status | Configure apache-status URL for Munin"
  ansible.builtin.lineinfile:
    dest: "/etc/munin/plugin-conf.d/munin-node"
    line: "env.url http://{{ apache_serverstatus_host }}/server-status-{{ apache_serverstatus_suffix }}?auto"
    regexp: 'env.url http://[^\\/]+/server-status'
    insertafter: "[apache_*]"
    create: no
  notify: "restart munin-node"
  tags:
    - apache

- name: "server_status | Add mailgraph URL in index.html"
  ansible.builtin.lineinfile:
    dest: "/var/www/index.html"
    state: "present"
    line: '            <li><a href="/mailgraph">Stats Mail</a></li>'
    insertbefore: "</ul>"
  tags:
    - apache
