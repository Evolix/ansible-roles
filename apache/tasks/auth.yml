---

- name: "auth | Init ipaddr_whitelist.conf file"
  ansible.builtin.copy:
    src: "ipaddr_whitelist.conf"
    dest: "{{ apache_config_dir }}/ipaddr_whitelist.conf"
    owner: "root"
    group: "root"
    mode: "0640"
    force: false
  tags:
    - apache

- name: "auth | Load IP whitelist task"
  ansible.builtin.import_tasks: ip_whitelist.yml

- name: "include private IP whitelist for server-status"
  ansible.builtin.lineinfile:
    dest: "{{ apache_config_dir }}/mods-available/status.conf"
    line: "        include {{ apache_config_dir }}/ipaddr_whitelist.conf"
    insertafter: 'SetHandler server-status'
    state: "present"
  tags:
    - apache

- name: "auth | Copy private_htpasswd"
  ansible.builtin.copy:
    src: "private_htpasswd"
    dest: "{{ apache_config_dir }}/private_htpasswd"
    owner: "root"
    group: "root"
    mode: "0640"
    force: false
  notify: "reload apache"
  tags:
    - apache

- name: "auth | Add user:pwd to private htpasswd"
  ansible.builtin.lineinfile:
    dest: "{{ apache_config_dir }}/private_htpasswd"
    line: "{{ item }}"
    state: "present"
  loop: "{{ apache_private_htpasswd_present }}"
  notify: "reload apache"
  tags:
    - apache

- name: "auth | Remove user:pwd from private htpasswd"
  ansible.builtin.lineinfile:
    dest: "{{ apache_config_dir }}/private_htpasswd"
    line: "{{ item }}"
    state: "absent"
  loop: "{{ apache_private_htpasswd_absent }}"
  notify: "reload apache"
  tags:
    - apache
