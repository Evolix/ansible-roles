---

- name: "Packages are installed (Debian 9 or later)"
  ansible.builtin.apt:
    name:
      - apache2
      - apachetop
      - libwww-perl
    state: "present"
  tags:
    - apache
    - packages
  when: ansible_distribution_major_version is version('9', '>=')

- name: "Itk package is installed if required (Debian 9 or later)"
  ansible.builtin.apt:
    name:
      - libapache2-mpm-itk
    state: "present"
  tags:
    - apache
    - packages
  when:
    - ansible_distribution_major_version is version('9', '>=')
    - apache_mpm == "itk"

- name: "Packages are installed (jessie)"
  ansible.builtin.apt:
    name:
      - apache2-mpm-itk
      - apachetop
      - libwww-perl
    state: "present"
  tags:
    - apache
    - packages
  when: ansible_distribution_release == "jessie"

- name: "Basic modules are enabled"
  community.general.apache2_module:
    name: '{{ item }}'
    state: "present"
  loop:
    - rewrite
    - expires
    - headers
    - ssl
    - include
    - negotiation
    - alias
  notify: "reload apache"
  tags:
    - apache

- name: "Basic modules are enabled"
  community.general.apache2_module:
    name: '{{ item }}'
    state: "present"
  loop:
    - cgi
  notify: "reload apache"
  when: apache_mpm == "prefork" or apache_mpm == "itk"
  tags:
    - apache


- name: "Copy Apache defaults config file"
  ansible.builtin.copy:
    src: "evolinux-defaults.conf"
    dest: "{{ apache_config_dir }}/conf-available/z-evolinux-defaults.conf"
    owner: "root"
    group: "root"
    mode: "0640"
    force: true
  notify: "reload apache"
  tags:
  - apache

- name: "Copy Apache defaults config file"
  ansible.builtin.copy:
    src: "evolinux-badbots.conf"
    dest: "{{ apache_config_dir }}/conf-available/z-evolinux-badbots.conf"
    owner: "root"
    group: "root"
    mode: "0640"
    force: true
  notify: "reload apache"
  tags:
  - apache

- name: "Copy Apache custom config file"
  ansible.builtin.copy:
    src: "evolinux-custom.conf"
    dest: "{{ apache_config_dir }}/conf-available/zzz-evolinux-custom.conf"
    owner: "root"
    group: "root"
    mode: "0640"
    force: false
  notify: "reload apache"
  tags:
  - apache

- name: "Disable status.conf"
  ansible.builtin.file:
    dest: "{{ apache_config_dir }}/mods-enabled/status.conf"
    state: "absent"
  notify: "reload apache"
  tags:
    - apache

- name: "Ensure Apache config files are enabled"
  ansible.builtin.command:
    cmd: "a2enconf {{ item }}"
  register: command_result
  changed_when: "'Enabling' in command_result.stderr"
  loop:
    - "z-evolinux-defaults.conf"
    - "zzz-evolinux-custom.conf"
  notify: "reload apache"
  tags:
    - apache

- ansible.builtin.import_tasks: auth.yml
  tags:
  - apache

- name: "Default vhost is installed"
  ansible.builtin.template:
    src: "evolinux-default.conf.j2"
    dest: "{{ apache_config_dir }}/sites-available/000-evolinux-default.conf"
    mode: "0640"
    force: false
  notify: "reload apache"
  tags:
    - apache

- name: "Default vhost is enabled"
  ansible.builtin.file:
    src: "{{ apache_config_dir }}/sites-available/000-evolinux-default.conf"
    dest: "{{ apache_config_dir }}/sites-enabled/000-default.conf"
    state: "link"
    force: true
  notify: "reload apache"
  when: apache_evolinux_default_enabled | bool
  tags:
    - apache

- ansible.builtin.import_tasks: server_status.yml
  tags:
    - apache

- name: "Is umask already present?"
  ansible.builtin.command:
    cmd: "grep --extended-regexp '^umask ' {{ apache_config_dir }}/envvars"
  failed_when: False
  changed_when: False
  register: envvar_grep_umask
  check_mode: no
  tags:
    - apache

- name: "Add a mark in envvars for umask"
  ansible.builtin.blockinfile:
    dest: "{{ apache_config_dir }}/envvars"
    marker: "## {mark} ANSIBLE MANAGED BLOCK"
    block: |
      ## Set umask for writing by Apache user.
      ## Set rights on files and directories written by Apache
      umask 007
  when: envvar_grep_umask.rc != 0
  tags:
    - apache

- ansible.builtin.include_role:
    name: evolix/remount-usr
  tags:
    - apache

- name: "/usr/share/scripts exists"
  ansible.builtin.file:
    dest: "/usr/share/scripts"
    mode: "0700"
    owner: "root"
    group: "root"
    state: "directory"
  tags:
    - apache

- name: "Install save_apache_status.sh"
  ansible.builtin.copy:
    src: "save_apache_status.sh"
    dest: "/usr/share/scripts/save_apache_status.sh"
    mode: "0755"
    force: false
  tags:
    - apache

- name: "Logrotate: {{ apache_logrotate_frequency }}"
  ansible.builtin.replace:
    dest: "/etc/logrotate.d/apache2"
    regexp: "(daily|weekly|monthly)"
    replace: "{{ apache_logrotate_frequency }}"
  tags:
    - apache

- name: "Logrotate: rotate {{ apache_logrotate_rotate }}"
  ansible.builtin.replace:
    dest: "/etc/logrotate.d/apache2"
    regexp: '^(\s+rotate) \d+$'
    replace: '\1 {{ apache_logrotate_rotate }}'
  tags:
    - apache

- name: "Setup log2mail"
  ansible.builtin.import_tasks: "log2mail.yml"
  when: apache_log2mail_include
  tags:
    - apache

- name: "Setup munin"
  ansible.builtin.import_tasks: "munin.yml"
  when: apache_munin_include | bool
  tags:
    - apache
