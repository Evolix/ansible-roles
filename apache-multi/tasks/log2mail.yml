---
- name: "log2mail | log2mail is installed"
  ansible.builtin.apt:
    name: "log2mail"
    state: "present"
  tags:
    - "apache"
    - "log2mail"

- name: "log2mail | Add log2mail config for Apache segfaults"
  ansible.builtin.template:
    src: "log2mail-apache.j2"
    dest: "/etc/log2mail/config/apache"
    owner: "log2mail"
    group: "adm"
    mode: "0644"
    force: false
  tags:
    - "apache"
    - "log2mail"
