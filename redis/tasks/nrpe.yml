---

- name: Install perl lib-redis (needed by check_redis)
  ansible.builtin.apt:
    name: libredis-perl
    state: present
  tags:
    - redis
    - nrpe

- name: install check_redis on Jessie
  ansible.builtin.copy:
    src: check_redis.pl
    dest: /usr/local/lib/nagios/plugins/check_redis
    force: true
    mode: "0755"
    owner: root
    group: root
  when:
    - ansible_distribution == "Debian"
    - ansible_distribution_major_version is version('9', '<')
  tags:
    - redis
    - nrpe

- name: sudo without password for nagios
  ansible.builtin.lineinfile:
    dest: /etc/sudoers.d/evolinux
    regexp: 'check_redis$'
    line: 'nagios          ALL = NOPASSWD: {{ redis_check_redis_path }}'
    insertafter: '^nagios'
    validate: "visudo -cf %s"
    create: yes
  when: redis_instance_name is defined
  tags:
    - redis
    - nrpe

- name: Use check_redis for NRPE
  ansible.builtin.replace:
    dest: /etc/nagios/nrpe.d/evolix.cfg
    regexp: '^command\[check_redis\]=.+'
    replace: 'command[check_redis]={{ redis_monitoringctl_wrapper_cmd }}sudo {{ redis_check_redis_path }} {{ redis_check_params }}'
  vars:
    redis_check_params: >-
      {%- if redis_password is undefined or redis_password is none or redis_password | length == 0 -%}
        -H {{ redis_check_interface }} -p {{ redis_port }}
      {%- else -%}
        -H {{ redis_check_interface }} -p {{ redis_port }} -x '{{ redis_password }}'
      {%- endif -%}
  when:
    - redis_instance_name is undefined
  notify: restart nagios-nrpe-server
  tags:
    - redis
    - nrpe

- name: sudo without password for nagios
  ansible.builtin.lineinfile:
    dest: /etc/sudoers.d/evolinux
    regexp: 'check_redis$'
    line: 'nagios          ALL = NOPASSWD: {{ redis_check_redis_path }}'
    insertafter: '^nagios'
    validate: "visudo -cf %s"
  when: redis_instance_name is undefined
  tags:
    - redis
    - nrpe

- name: "Remount /usr with RW for 'install check_redis instance'"
  ansible.builtin.include_role:
    name: evolix/remount-usr

- name: install check_redis_instances
  ansible.builtin.copy:
    src: check_redis_instances.sh
    dest: /usr/local/lib/nagios/plugins/check_redis_instances
    force: true
    mode: "0755"
    owner: root
    group: root
  tags:
    - redis
    - nrpe

- name: Use check_redis_instances for NRPE
  ansible.builtin.replace:
    dest: /etc/nagios/nrpe.d/evolix.cfg
    regexp: '^command\[check_redis\]=.+'
    replace: 'command[check_redis]={{ redis_monitoringctl_wrapper_cmd }}sudo /usr/local/lib/nagios/plugins/check_redis_instances'
  when: redis_instance_name is defined
  notify: restart nagios-nrpe-server
  tags:
    - redis
    - nrpe

- name: sudo without password for nagios
  ansible.builtin.lineinfile:
    dest: /etc/sudoers.d/evolinux
    regexp: 'check_redis_instances$'
    line: 'nagios          ALL = NOPASSWD: /usr/local/lib/nagios/plugins/check_redis_instances'
    insertafter: '^nagios'
    validate: "visudo -cf %s"
  when: redis_instance_name is defined
  tags:
    - redis
    - nrpe
