
- name: Postfix packages are installed
  ansible.builtin.apt:
    name:
      - postfix
      - mailgraph
    state: present
  tags:
    - postfix

- name: make sure a service Mailgraph is running and enabled
  ansible.builtin.systemd:
    name: mailgraph.service
    enabled: yes
    state: started

- name: Install Mailgraph nocgi wrapper
  ansible.builtin.copy:
    src: mailgraph-nocgi.sh
    dest: /usr/local/sbin/mailgraph-nocgi.sh
    mode: '0700'

- name: Setup a cron job to run Mailgraph every hour
  ansible.builtin.cron:
    name: "mailgraph"
    cron_file: "/etc/cron.d/mailgraph"
    job: /usr/local/sbin/mailgraph-nocgi.sh
    minute: "7"
    user: root

- name: exim4 is absent
  ansible.builtin.apt:
    name:
      - exim4
      - exim4-base
      - exim4-config
      - exim4-daemon-light
    purge: yes
    state: absent
  tags:
    - postfix
  when: postfix_purge_exim | bool

- name: compute main.cf SHA1 checksum
  ansible.builtin.shell:
    cmd: 'grep -v -E "^(myhostname|mydestination|mailbox_command)" /etc/postfix/main.cf | sha1sum | cut -d " " -f1'
  changed_when: False
  check_mode: no
  register: main_cf_checksum
  tags:
    - postfix

- name: add lines in /etc/.gitignore
  ansible.builtin.lineinfile:
    dest: /etc/.gitignore
    line: '{{ item }}'
    state: present
    create: no
  loop:
    - "postfix/sa-blacklist.access"
    - "postfix/*.db"
  tags:
    - postfix
    - etc-git
