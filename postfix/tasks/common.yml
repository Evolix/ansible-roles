---

- name: "Debconf settings"
  ansible.builtin.debconf:
    name: postfix
    question: "{{ item.key }}"
    value: "{{ item.value }}"
    vtype: "{{ item.type }}"
  loop:
    - { key: 'postfix/main_mailer_type', type: 'string', value: 'No configuration' }
    - { key: 'postfix/mailname',         type: 'string', value: "{{ evolinux_fqdn | default(ansible_fqdn) }}" }

- name: Postfix packages are installed
  ansible.builtin.apt:
    name:
      - postfix
      - mailgraph
    state: present
  tags:
    - postfix

- name: exim4 is absent
  ansible.builtin.apt:
    name:
      - exim4
      - exim4-base
      - exim4-config
      - exim4-daemon-light
    purge: yes
    state: absent
  tags:
    - postfix
  when: postfix_purge_exim | bool

- name: compute main.cf SHA1 checksum
  ansible.builtin.shell:
    cmd: 'grep -v -E "^(myhostname|mydestination|mailbox_command)" /etc/postfix/main.cf | sha1sum | cut -d " " -f1'
  changed_when: False
  check_mode: no
  register: main_cf_checksum
  tags:
    - postfix

- name: add lines in /etc/.gitignore
  ansible.builtin.lineinfile:
    dest: /etc/.gitignore
    line: '{{ item }}'
    state: present
    create: no
  loop:
    - "postfix/sa-blacklist.access"
    - "postfix/*.db"
  tags:
    - postfix
    - etc-git
