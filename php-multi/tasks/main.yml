---

- name: "Compatibility check"
  ansible.builtin.assert:
    that:
      - ansible_distribution == "Debian"
      - ansible_distribution_major_version is version('13', '>=')
    msg: Only compatible with Debian >= 13
  when: not (php_multi_disable_compatibility_check | bool)

############
## Misc
############

- name: "Create /etc/tmpfiles.d/php-multi.conf"
  ansible.builtin.copy:
    src: "etc/tmpfiles.d/php-multi.conf"
    dest: "/etc/tmpfiles.d/php-multi.conf"
    mode: "preserve"
  notify: "systemd-tmpfiles --create"

- ansible.builtin.meta: flush_handlers

############
## PHP
############

- name: "Deploy /etc/php/evolinux-common/ tree"
  ansible.builtin.copy:
    src: "etc/php/evolinux-common/"
    dest: "/etc/php/evolinux-common/"
    owner: "root"
    group: "root"
    mode: "preserve"
    directory_mode: "755"

- name: "Create /etc/php/evolinux-{{ php_multi_version }}"
  ansible.builtin.file:
    path: "/etc/php/evolinux-{{ php_multi_version }}"
    state: "directory"
    mode: "755"

- name: "Deploy /etc/php/evolinux-{{ php_multi_version }}/ directories"
  ansible.builtin.file:
    path: "/etc/php/evolinux-{{ php_multi_version }}/{{ item.path }}"
    state: "directory"
    mode: "755"
  with_community.general.filetree: "templates/etc/php/evolinux-VERSION/"
  when: "item.state == 'directory'"

- name: "Deploy /etc/php/evolinux-{{ php_multi_version }}/ files"
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "/etc/php/evolinux-{{ php_multi_version }}/{{ item.path }}"
    mode: "644"
  with_community.general.filetree: "templates/etc/php/evolinux-VERSION/"
  when: "item.state == 'file'"

############
## Podman
############

- name: "Install podman packages"
  ansible.builtin.apt:
    name:
      - "podman"
      - "podman-compose"
      - "passt"
      - "catatonit"
      - "aardvark-dns"
      - "cpp"

- name: "Create /var/lib/evolinux/containers/"
  ansible.builtin.file:
    path: "/var/lib/evolinux/containers/"
    state: "directory"
    mode: "755"
    
- name: "Deploy /etc/evolinux/containers/php{{ php_multi_version }}/"
  ansible.builtin.copy:
    src: "etc/evolinux/containers/php{{ php_multi_version }}/"
    dest: "/etc/evolinux/containers/php{{ php_multi_version }}/"
    mode: "preserve"
    directory_mode: "755"
    
- name: "Create /etc/containers/systemd/php{{ php_multi_version }}.build"
  ansible.builtin.copy:
    src: "etc/containers/systemd/php{{ php_multi_version }}.build"
    dest: "/etc/containers/systemd/php{{ php_multi_version }}.build"
    mode: "preserve"
  notify: "systemctl daemon-reload"

- name: "Create /etc/containers/systemd/php-fpm{{ php_multi_version }}.container"
  ansible.builtin.copy:
    src: "etc/containers/systemd/php-fpm{{ php_multi_version }}.container"
    dest: "/etc/containers/systemd/php-fpm{{ php_multi_version }}.container"
    mode: "preserve"
  notify: "systemctl daemon-reload"

- ansible.builtin.meta: flush_handlers

- name: "Start and enable php-fpm{{ php_multi_version }}.service"
  ansible.builtin.service:
    name: "php-fpm{{ php_multi_version }}.service"
    state: "started"
    enabled: true
