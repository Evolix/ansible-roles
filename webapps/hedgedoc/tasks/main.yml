---
# tasks file for hedgedoc install

- name: Install main system dependencies
  ansible.builtin.apt:
    name: "{{ hedgedoc_system_dep }}"
    update_cache: true

- ansible.builtin.include_role:
    name: evolix/remount-usr

- name: Enable yarn (via corepack)
  ansible.builtin.shell: "corepack enable"

- name: Install node-gyp from npm
  ansible.builtin.shell: npm install --global node-gyp corepack

- name: Fix permissions
  ansible.builtin.file:
    path: /usr/lib/node_modules
    mode: g+rx,o+rx
    recurse: yes

- name: Add UNIX account
  ansible.builtin.user:
    name: "{{ hedgedoc_instance }}"
    home: "{{ hedgedoc_home_base }}/{{ hedgedoc_instance }}"
    shell: /bin/bash

- name: Add tmp dir for Yarn 
  ansible.builtin.file:
    path: "~/tmp"
    state: directory
    mode: '0700'
  become_user: "{{ hedgedoc_instance }}"

- name: Set TMPDIR environment var for Yarn
  lineinfile:
    path: "~/.profile"
    line: 'export TMPDIR=~/tmp'
  become_user: "{{ hedgedoc_instance }}"

- name: Add dir to manage versions
  ansible.builtin.file:
    path: "~/versions"
    state: directory
    mode: '0700'
  become_user: "{{ hedgedoc_instance }}"

- name: Add PostgreSQL user
  community.postgresql.postgresql_user:
    name: "{{ hedgedoc_db_user }}"
    password: "{{ hedgedoc_db_password }}"
    no_password_changes: true
  become_user: postgres

- name: Add PostgreSQL database
  community.postgresql.postgresql_db:
    name: "{{ hedgedoc_db_name }}"
    owner: "{{ hedgedoc_db_user }}"
  become_user: postgres

- name: Get app and run app setup
  become_user: "{{ hedgedoc_instance }}"
  block:
    - name: Unarchive hedgedoc archive
      ansible.builtin.unarchive:
        src: "{{ hedgedoc_download_url }}"
        dest: ~/versions
        remote_src: true
    - name: Append version to directory name
      ansible.builtin.command:
        cmd: "mv ~/versions/hedgedoc ~/versions/hedgedoc-{{ hedgedoc_version }}"
    - name: Symbolic link to unarchived version
      ansible.builtin.file:
        src: "~/versions/hedgedoc-{{ hedgedoc_version }}"
        dest: "~/hedgedoc"
        state: link
    - name: Run setup
      ansible.builtin.shell: ". ~/.profile && bin/setup"
      args:
        chdir: "~/hedgedoc"
        executable: /bin/bash

- name: Template json config file
  ansible.builtin.template:
    src: "config.json.j2"
    dest: "~{{ hedgedoc_instance }}/hedgedoc/config.json"
    owner: "{{ hedgedoc_instance }}"
    group: "{{ hedgedoc_instance }}"
    mode: "0640"

- name: Add systemd unit
  ansible.builtin.template:
    src: "hedgedoc.service.j2"
    dest: "/etc/systemd/system/{{ hedgedoc_instance }}.service"

- name: Enable systemd units
  ansible.builtin.systemd:
    name: "{{ hedgedoc_instance }}.service"
    enabled: true
    daemon_reload: true

- name: Start service
  ansible.builtin.service:
    name: "{{ hedgedoc_instance }}.service"
    state: restarted

- name: Check if SSL certificate is present and register result
  ansible.builtin.stat:
    path: "/etc/letsencrypt/live/{{ hedgedoc_instance }}/fullchain.pem"
  register: ssl

- name: Generate certificate only if required (first time)
  when: not ssl.stat.exists
  block:
    - name: Template vhost without SSL for successfull LE challengce
      ansible.builtin.template:
        src: "vhost.conf.j2"
        dest: "/etc/nginx/sites-available/{{ hedgedoc_instance }}"
    - name: Enable temporary nginx vhost for LE
      ansible.builtin.file:
        src: "/etc/nginx/sites-available/{{ hedgedoc_instance }}"
        dest: "/etc/nginx/sites-enabled/{{ hedgedoc_instance }}"
        state: link
    - name: Reload nginx conf
      ansible.builtin.service:
        name: nginx
        state: reloaded
    - name: Make sure /var/lib/letsencrypt exists and has correct permissions
      ansible.builtin.file:
        path: /var/lib/letsencrypt
        state: directory
        mode: '0755'
    - name: Generate certificate with certbot
      ansible.builtin.command:
        cmd: |
          certbot certonly --webroot --webroot-path /var/lib/letsencrypt
           --non-interactive
           --agree-tos
           --email {{ hedgedoc_certbot_admin_email }}
           --cert-name {{ hedgedoc_instance }}
           -d {{ hedgedoc_domains | first }}
    - name: Create the ssl dir if needed
      ansible.builtin.file:
        path: /etc/nginx/ssl
        state: directory
        mode: '0750'
    - name: Template ssl bloc for nginx vhost
      ansible.builtin.template:
        src: "ssl.conf.j2"
        dest: "/etc/nginx/ssl/{{ hedgedoc_instance }}.conf"

- name: (Re)check if SSL certificate is present and register result
  ansible.builtin.stat:
    path: "/etc/letsencrypt/live/{{ hedgedoc_instance }}/fullchain.pem"
  register: ssl

- name: (Re)template conf file for nginx vhost with SSL
  ansible.builtin.template:
    src: "vhost.conf.j2"
    dest: "/etc/nginx/sites-available/{{ hedgedoc_instance }}"

- name: Enable nginx vhost for hedgedoc
  ansible.builtin.file:
    src: "/etc/nginx/sites-available/{{ hedgedoc_instance }}"
    dest: "/etc/nginx/sites-enabled/{{ hedgedoc_instance }}"
    state: link

- name: Reload nginx conf
  ansible.builtin.service:
    name: nginx
    state: reloaded
