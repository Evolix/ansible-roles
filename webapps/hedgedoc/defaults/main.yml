---
# defaults file for mastodon
hedgedoc_system_dep: "['apt-transport-https', 'python3-psycopg2', 'git', 'wget']"
hedgedoc_git_url: 'https://github.com/hedgedoc/hedgedoc.git'
hedgedoc_version: '1.10.3'
hedgedoc_download_url: "https://github.com/hedgedoc/hedgedoc/releases/download/{{ hedgedoc_version }}/hedgedoc-{{ hedgedoc_version }}.tar.gz"
hedgedoc_node_version: 'node_22.x'
hedgedoc_node_port: '3000'
hedgedoc_home_base: '/home'
hedgedoc_instance: 'example'
hedgedoc_domains: ['example.domain.org']
hedgedoc_certbot_admin_email: 'security@example.org'

hedgedoc_db_host: 'localhost'
hedgedoc_db_user: "{{ hedgedoc_instance }}"
hedgedoc_db_name: "{{ hedgedoc_instance }}"
hedgedoc_db_password: 'CHANGE_ME'
