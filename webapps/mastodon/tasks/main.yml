---
# tasks file for mastodon install

- name: Install main system dependencies
  ansible.builtin.apt:
    name: "{{ mastodon_system_dep }}"
    update_cache: true

- name: Enable yarn (via corepack)
  ansible.builtin.shell:
    cmd: corepack enable

- name: Add PostgreSQL user
  community.postgresql.postgresql_user:
    name: "{{ mastodon_db_user }}"
    password: "{{ mastodon_db_password }}"
    role_attr_flags: CREATEDB
  become_user: postgres

- name: Add UNIX account
  ansible.builtin.user:
    name: "{{ mastodon_instance }}"
    home: "{{ mastodon_home_base }}/{{ mastodon_instance }}"
    shell: /bin/bash

- name: Add tmp dir for Yarn 
  ansible.builtin.file:
    path: "~/tmp"
    state: directory
    mode: '0700'
  become_user: "{{ mastodon_instance }}"

- name: Set TMPDIR environment var for Yarn
  lineinfile:
    path: "~/.profile"
    line: 'export TMPDIR=~/tmp'
  become_user: "{{ mastodon_instance }}"

- name: Install Ruby for instance user (rbenv)
  ansible.builtin.include_role:
    name: rbenv
  vars:
    - username: "{{ mastodon_instance }}"
    - rbenv_ruby_version: "{{ mastodon_ruby_version }}"
    - rbenv_ruby_configure_opts: "{{ mastodon_ruby_configure_opts }}"

- name: Clone Mastodon repo (git)
  ansible.builtin.git:
    repo: "{{ mastodon_git_url }}"
    dest: "~/mastodon/"
    version: "{{ mastodon_git_version | default(omit) }}"
    force: true
    update: true
    umask: '0022'
  become_user: "{{ mastodon_instance }}"

- name: Install and configure app with bundler and yarn
  become_user: "{{ mastodon_instance }}"
  block:
    - name: Install gem dependencies
      ansible.builtin.shell: ". ~/.profile && bundle install"
      args:
        chdir: "~/mastodon"
        executable: /bin/bash # fails with /bin/sh
    - name: Prepare yarn 4 (via corepack)
      ansible.builtin.shell:
        cmd: corepack prepare
      args:
        chdir: "~/mastodon"
        executable: /bin/bash # fails with /bin/sh
    - name: Install javascript dependencies
      ansible.builtin.shell: ". ~/.profile && yarn install --immutable"
      args:
        chdir: "~/mastodon"
        executable: /bin/bash # fails with /bin/sh

- name: Template .env.production configuration file
  ansible.builtin.template:
    src: "env.j2"
    dest: "~{{ mastodon_instance }}/mastodon/.env.production"
    owner: "{{ mastodon_instance }}"
    group: "{{ mastodon_instance }}"
    mode: "0640"

- name: Check if secrets need to be generated or not
  ansible.builtin.shell: "grep -P SECRET_KEY_BASE=[[:alnum:]]{128} .env.production"
  args:
    chdir: "~/mastodon"
  become_user: "{{ mastodon_instance }}"
  register: secrets
  failed_when: "secrets.rc == 2"

- name: Generate secrets if needed
  become_user: "{{ mastodon_instance }}"
  when: "secrets.rc == 1"
  block:
    - name: Generate secret for SECRET_KEY_BASE
      ansible.builtin.shell: '. ~/.profile && sed -i -r "s/SECRET_KEY_BASE=/SECRET_KEY_BASE=$(RAILS_ENV=production bundle exec rails secret)/" .env.production'
      args:
        chdir: "~/mastodon"
        executable: /bin/bash # fails with /bin/sh
    - name: Generate secret for OTP_SECRET
      ansible.builtin.shell: '. ~/.profile && sed -i -r "s/OTP_SECRET=/OTP_SECRET=$(RAILS_ENV=production bundle exec rails secret)/" .env.production'
      args:
        chdir: "~/mastodon"
        executable: /bin/bash # fails with /bin/sh
    - name: Generate secret for VAPID_PRIVATE_KEY and VAPID_PUBLIC_KEY
      ansible.builtin.shell: . ~/.profile && RAILS_ENV=production bundle exec rake mastodon:webpush:generate_vapid_key > vapid.tmp
      args:
        chdir: "~/mastodon"
        executable: /bin/bash # fails with /bin/sh
    - name: Read VAPID_PRIVATE_KEY secret from temp file
      ansible.builtin.shell: "cat vapid.tmp | head -1 | cut -c 19-"
      args:
        chdir: "~/mastodon"
      register: mastodon_app_vapid_private_key
    - name: Read VAPID_PUBLIC_KEY secret from temp file
      ansible.builtin.shell: "cat vapid.tmp | tail -1 | cut -c 18-"
      args:
        chdir: "~/mastodon"
      register: mastodon_app_vapid_public_key
    - name: Delete secrets temp file
      ansible.builtin.file:
        path: "~/mastodon/vapid.tmp"
        state: absent
    - name: Write mastodon_app_vapid_private_key to production .env file
      ansible.builtin.lineinfile:
        path: "~/mastodon/.env.production"
        regexp: '^VAPID_PRIVATE_KEY='
        line: "VAPID_PRIVATE_KEY={{ mastodon_app_vapid_private_key.stdout }}"
    - name: Write mastodon_app_vapid_public_key to production .env file
      ansible.builtin.lineinfile:
        path: "~/mastodon/.env.production"
        regexp: '^VAPID_PUBLIC_KEY='
        line: "VAPID_PUBLIC_KEY={{ mastodon_app_vapid_public_key.stdout }}"
    - name: Generate secret for Active Record encryption
      ansible.builtin.shell: . ~/.profile && RAILS_ENV=production bin/rails db:encryption:init | tail -3 > active_record.tmp
      args:
        chdir: "~/mastodon"
        executable: /bin/bash # fails with /bin/sh
    - name: Read ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY secret from temp file
      ansible.builtin.shell: "cat active_record.tmp | head -1 | tail -1 | cut -c 44-"
      args:
        chdir: "~/mastodon"
      register: mastodon_app_active_record_deterministic_key
    - name: Read ACTIVE_RECORD_ENCRYPTION_DERIVATION_SALT secret from temp file
      ansible.builtin.shell: "cat active_record.tmp | head -2 | tail -1 | cut -c 46-"
      args:
        chdir: "~/mastodon"
      register: mastodon_app_active_record_derivation_salt
    - name: Read ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY secret from temp file
      ansible.builtin.shell: "cat active_record.tmp | head -3 | tail -1 | cut -c 38-"
      args:
        chdir: "~/mastodon"
      register: mastodon_app_active_record_primary_key
    - name: Delete secrets temp file
      ansible.builtin.file:
        path: "~/mastodon/active_record.tmp"
        state: absent
    - name: Write mastodon_app_active_record_deterministic_key to production .env file
      ansible.builtin.lineinfile:
        path: "~/mastodon/.env.production"
        regexp: '^ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY='
        line: "ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY={{ mastodon_app_active_record_deterministic_key.stdout }}"
    - name: Write mastodon_app_active_record_derivation_salt to production .env file
      ansible.builtin.lineinfile:
        path: "~/mastodon/.env.production"
        regexp: '^ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT='
        line: "ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT={{ mastodon_app_active_record_derivation_salt.stdout }}"
    - name: Write mastodon_app_active_record_primary_key to production .env file
      ansible.builtin.lineinfile:
        path: "~/mastodon/.env.production"
        regexp: '^ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY='
        line: "ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY={{ mastodon_app_active_record_primary_key.stdout }}"

- name: Check if mastodon database is already present or not
  ansible.builtin.shell: |
   psql -lqt | cut -d \| -f 1 | grep -qw {{ mastodon_instance }}_production
  become_user: postgres
  register: db_present
  failed_when: "db_present.rc == 2"

- name: Setup database schema if database not already present
  ansible.builtin.shell: ". ~/.profile && RAILS_ENV=production SAFETY_ASSURED=1 bundle exec rails db:setup"
  args:
    chdir: "~/mastodon"
    executable: /bin/bash # fails with /bin/sh
  become_user: "{{ mastodon_instance }}"
  when: "db_present.rc == 1"

- name: Precompile assets
  ansible.builtin.shell: ". ~/.profile && RAILS_ENV=production bundle exec rails assets:precompile"
  args:
    chdir: "~/mastodon"
    executable: /bin/bash # fails with /bin/sh
  become_user: "{{ mastodon_instance }}"

- name: Adjust permissions of files in public folder
  ansible.builtin.file:
    path: "~/mastodon/public"
    state: directory
    mode: 'o=rX'
    recurse: true
  become_user: "{{ mastodon_instance }}"

- name: Add systemd target
  ansible.builtin.template:
    src: "mastodon.target.j2"
    dest: "/etc/systemd/system/{{ mastodon_instance }}.target"
    mode: '0600'

- name: Add systemd web unit
  ansible.builtin.template:
    src: "mastodon-web.service.j2"
    dest: "/etc/systemd/system/{{ mastodon_instance }}-web.service"
    mode: '0600'

- name: Add systemd sidekiq unit
  ansible.builtin.template:
    src: "mastodon-sidekiq.service.j2"
    dest: "/etc/systemd/system/{{ mastodon_instance }}-sidekiq.service"
    mode: '0600'

- name: Add systemd streaming unit
  ansible.builtin.template:
    src: "mastodon-streaming.service.j2"
    dest: "/etc/systemd/system/{{ mastodon_instance }}-streaming.service"
    mode: '0600'

- name: Enable systemd units
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    daemon_reload: true
  loop:
    - "{{ mastodon_instance }}.target"
    - "{{ mastodon_instance }}-web.service"
    - "{{ mastodon_instance }}-sidekiq.service"
    - "{{ mastodon_instance }}-streaming.service"

- name: Start services
  ansible.builtin.systemd:
    name: "{{ mastodon_instance }}.target"
    state: started

- name: Check if SSL certificate is present and register result
  ansible.builtin.stat:
    path: "/etc/letsencrypt/live/{{ mastodon_instance }}/fullchain.pem"
  register: ssl

- name: Generate certificate only if required (first time)
  when: not ssl.stat.exists
  block:
    - name: Template vhost without SSL for successfull LE challengce
      ansible.builtin.template:
        src: "vhost.j2"
        dest: "/etc/nginx/sites-available/{{ mastodon_instance }}"
        mode: '0640'
    - name: Enable temporary nginx vhost for LE
      ansible.builtin.file:
        src: "/etc/nginx/sites-available/{{ mastodon_instance }}"
        dest: "/etc/nginx/sites-enabled/{{ mastodon_instance }}"
        state: link
    - name: Reload nginx conf
      ansible.builtin.systemd:
        name: nginx
        state: reloaded
    - name: Generate certificate with certbot
      ansible.builtin.command:
        cmd: |
          certbot certonly --webroot
           --webroot-path /var/lib/letsencrypt
           --non-interactive
           --agree-tos
           --email {{ mastodon_certbot_admin_email }}
           --cert-name {{mastodon_instance }}
           -d {{ mastodon_domains | first }}

- name: (Re)check if SSL certificate is present and register result
  ansible.builtin.stat:
    path: "/etc/letsencrypt/live/{{ mastodon_instance }}/fullchain.pem"
  register: ssl

- name: (Re)template conf file for nginx vhost with SSL
  ansible.builtin.template:
    src: "vhost.j2"
    dest: "/etc/nginx/sites-available/{{ mastodon_instance }}"
    mode: '0640'

- name: Enable nginx vhost for mastodon
  ansible.builtin.file:
    src: "/etc/nginx/sites-available/{{ mastodon_instance }}"
    dest: "/etc/nginx/sites-enabled/{{ mastodon_instance }}"
    state: link

- name: Reload nginx conf
  ansible.builtin.systemd:
    name: nginx
    state: reloaded
