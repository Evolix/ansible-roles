---
# defaults file for etherpad
etherpad_instance: 'example'
etherpad_system_dep: "['apt-transport-https', 'python3-mysqldb', 'git', 'wget']"
etherpad_git_url: 'https://github.com/ether/etherpad-lite.git'
etherpad_version: '0.5.0'
etherpad_download_url: "https://github.com/ether/etherpad-go/releases/download/v{{ etherpad_version }}/etherpad-go-linux-amd64"
etherpad_app_port: '9001'
etherpad_domains: ['etherpad.example.com']
etherpad_certbot_admin_email: 'security@etherpad.example.com'

etherpad_db_host: '127.0.0.1'
etherpad_db_port: '3306'
etherpad_db_user: "{{ etherpad_instance }}"
etherpad_db_name: "{{ etherpad_instance }}"
etherpad_db_password: 'CHANGE_THIS_PASSWORD'

etherpad_app_ip: '127.0.0.1'
etherpad_app_title: 'Mon Etherpad'
etherpad_app_db_type: 'mysql'
etherpad_app_skin_name: 'colibris'
etherpad_app_skin_variants: 'super-light-toolbar super-light-editor light-background'
etherpad_app_trust_proxy: 'true'
etherpad_app_require_authentication: 'false'
etherpad_app_require_authorization: 'true'
etherpad_app_admin_password: 'CHANGE_ME_TOO'
etherpad_app_default_pad_text: 'Bienvenue sur Etherpad !'
#etherpad_app_default_pad_text: |
#  Bienvenue sur Etherpad !\\n\\nLe texte de ce bloc-notes est synchronisé sur le serveur au fur et à
#   mesure que vous tapez, de sorte que toutes les personnes qui consultent cette page voient le
#    même texte. Cela vous permet de collaborer de manière transparente et collaborative sur
#     des documents !\\n\\nParticipez à Etherpad sur https:\/\/etherpad.org\n
etherpad_app_file_ends: 'false'
