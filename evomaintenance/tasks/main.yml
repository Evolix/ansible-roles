---

- ansible.builtin.import_tasks: install_package_debian.yml
  when:
    - not (evomaintenance_install_vendor | bool)
    - ansible_distribution == "Debian"

- ansible.builtin.import_tasks: install_vendor_debian.yml
  when:
    - evomaintenance_install_vendor | bool
    - ansible_distribution == "Debian"

- ansible.builtin.import_tasks: install_vendor_other.yml
  when:
    - evomaintenance_install_vendor | bool
    - ansible_distribution != "Debian"


- ansible.builtin.import_tasks: config.yml
