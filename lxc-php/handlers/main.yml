---

- name: Reload PHP-FPM
  ansible.builtin.shell:
    cmd: "lxc-attach --name {{ lxc_php_version }} -- systemctl reload {{ lxc_php_services[lxc_php_version] }}"

- name: Restart PHP-FPM
  ansible.builtin.shell:
    cmd: "lxc-attach --name {{ lxc_php_version }} -- systemctl restart {{ lxc_php_services[lxc_php_version] }}"

- name: Reload php84-fpm
  ansible.builtin.shell:
    cmd: "lxc-attach --name {{ lxc_php_version }} -- systemctl reload php8.4-fpm"

- name: Reload php83-fpm
  ansible.builtin.shell:
    cmd: "lxc-attach --name {{ lxc_php_version }} -- systemctl reload php8.3-fpm"

- name: Reload php82-fpm
  ansible.builtin.shell:
    cmd: "lxc-attach --name {{ lxc_php_version }} -- systemctl reload php8.2-fpm"

- name: Reload php81-fpm
  ansible.builtin.shell:
    cmd: "lxc-attach --name {{ lxc_php_version }} -- systemctl reload php8.1-fpm"

- name: Reload php80-fpm
  ansible.builtin.shell:
    cmd: "lxc-attach --name {{ lxc_php_version }} -- systemctl reload php8.0-fpm"

- name: Reload php74-fpm
  ansible.builtin.shell:
    cmd: "lxc-attach --name {{ lxc_php_version }} -- systemctl reload php7.4-fpm"

- name: Reload php73-fpm
  ansible.builtin.shell:
    cmd: "lxc-attach --name {{ lxc_php_version }} -- systemctl reload php7.3-fpm"

- name: Reload php70-fpm
  ansible.builtin.shell:
    cmd: "lxc-attach --name {{ lxc_php_version }} -- systemctl reload php7.0-fpm"

- name: Reload php56-fpm
  ansible.builtin.shell:
    cmd: "lxc-attach --name {{ lxc_php_version }} -- systemctl reload php5-fpm"

- name: Restart opensmtpd
  ansible.builtin.shell:
    cmd: "lxc-attach --name {{ lxc_php_version }} -- systemctl restart opensmtpd"

- name: Daemon reload
  ansible.builtin.shell:
    cmd: "lxc-attach --name {{ lxc_php_version }} -- systemctl daemon-reload"

- name: Restart container
  community.general.lxc_container:
    name: "{{ lxc_php_version }}"
    state: restarted

- name: restart munin-node
  ansible.builtin.service:
    name: munin-node
    state: restarted
