---

- name: "{{ lxc_php_container_name }} - Install dependency packages"
  ansible.builtin.shell:
    cmd: "DEBIAN_FRONTEND=noninteractive lxc-attach --name {{ lxc_php_container_name }} -- apt-get install -y wget gnupg"

- name: "{{ lxc_php_container_name }} - delete sources.list trixie repository"
  ansible.builtin.file:
    path: "{{ lxc_rootfs }}/etc/apt/sources.list"
    state: absent

- name: "{{ lxc_php_container_name }} - system trixie repository"
  ansible.builtin.template:
    src: bookworm_basics.sources.j2
    dest: "{{ lxc_rootfs }}/etc/apt/sources.list.d/system.sources"
    force: true
    mode: "0644"

- name: "{{ lxc_php_container_name }} - security bookworm repository"
  ansible.builtin.template:
    src: bookworm_security.sources.j2
    dest: "{{ lxc_rootfs }}/etc/apt/sources.list.d/security.sources"
    force: true
    mode: "0644"

- name: "{{ lxc_php_container_name }} - Update APT cache"
  ansible.builtin.shell:
    cmd: "DEBIAN_FRONTEND=noninteractive lxc-attach --name {{ lxc_php_container_name }} -- apt-get update"

- name: "{{ lxc_php_container_name }} - Install PHP packages"
  ansible.builtin.shell:
    cmd: "DEBIAN_FRONTEND=noninteractive lxc-attach --name {{ lxc_php_container_name }} -- apt-get install -y php-fpm php-cli php-gd php-intl php-ldap php-mysql php-pgsql php-sqlite3 php-curl php-zip php-mbstring php-xml php-zip composer libphp-phpmailer"

- name: "{{ lxc_php_container_name }} - Copy evolinux PHP configuration"
  ansible.builtin.template:
    src: z-evolinux-defaults.ini.j2
    dest: "{{ line_item }}"
    mode: "0644"
  notify: "Reload {{ lxc_php_version }}-fpm"
  loop:
    - "{{ lxc_rootfs }}/etc/php/8.4/fpm/conf.d/z-evolinux-defaults.ini"
    - "{{ lxc_rootfs }}/etc/php/8.4/cli/conf.d/z-evolinux-defaults.ini"
  loop_control:
    loop_var: line_item

- ansible.builtin.import_tasks: "mail_opensmtpd.yml"
